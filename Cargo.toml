[package]
name = "codex24h"
version = "0.2.1"
edition = "2024"
description = "A local PTY terminal wrapper for Codex with frozen scrollback browsing"
license = "MIT"

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
libc = "0.2"
signal-hook = "0.4"
base64 = "0.22"
unicode-width = "0.2"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "codex24h"
path = "src/main.rs"
